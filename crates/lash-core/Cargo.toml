walkdir = { workspace = true }
pulldown-cmark = "0.12"
chrono = { workspace = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "parser_bench"
harness = false

[[bench]]
name = "graph_bench"
harness = false

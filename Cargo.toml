[workspace]
resolver = "2"
members = [
    "crates/lash-types",
    "crates/lash-core",
    "crates/lash-db",
    "crates/lash-agent",
    "crates/lash-tui",
    "crates/lash-cli",
]

[workspace.package]
version = "0.1.0"
authors = ["Lash Contributors"]
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
repository = "https://github.com/fixture-dev/lash"

[workspace.dependencies]
# Internal crates
lash-types = { path = "crates/lash-types" }
lash-core = { path = "crates/lash-core" }
lash-db = { path = "crates/lash-db" }
lash-agent = { path = "crates/lash-agent" }
lash-tui = { path = "crates/lash-tui" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Error handling
thiserror = "1.0"
anyhow = "1.0"
miette = { version = "7.0", features = ["fancy"] }

# Terminal output
colored = "2.1"
owo-colors = { version = "4.1", features = ["supports-colors"] }
indicatif = "0.17"

# CLI
clap = { version = "4.5", features = ["derive", "cargo", "wrap_help", "color", "suggestions"] }
clap_complete = "4.5"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# TUI
ratatui = "0.28"
crossterm = "0.28"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tracing-appender = "0.2"

# Utilities
walkdir = "2.5"
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }
ignore = "0.4"
similar = "2.6"
blake3 = "1.5"
notify = "6.1"
rayon = "1.10"
dirs = "5.0"
atty = "0.2"
strsim = "0.11"
once_cell = "1.19"

# Platform
libc = "0.2"

# Testing (dev dependencies)
tempfile = "3.15"
assert_cmd = "2.0"
predicates = "3.1"
insta = { version = "1.40", features = ["json", "yaml"] }
rstest = "0.23"
serial_test = "3.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

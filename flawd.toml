[languages]
enabled = ["rs"]

[coverage]
inputs = [
  { format = "lcov", path = "coverage/lcov.info" }
]
command = "mkdir -p coverage && cargo llvm-cov --workspace --lcov --output-path coverage/lcov.info"
timeout_seconds = 300

[test]
command = "cargo test"
timeout_seconds = 600
baseline_required = true

[mutations]
budget = 400
per_file_budget = 80
operators = ["core", "comparisons", "boolean", "returns"]
risky_operators = false

[pare]
dedupe = true
sampling = "weighted"
cache = true

[docker]
dockerfile = "Dockerfile"
workdir = "/app"
network = "bridge"

[runner]
# rehearsal branch only: native is the hosted-runner recommendation
isolation = "native"
